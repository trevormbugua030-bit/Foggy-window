<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#18262b">
    <meta name="description" content="A quiet moment with a fogged window. Wipe the glass to see the morning beyond.">
    <title>Foggy Window — A quiet moment</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="window" aria-label="Foggy window scene">
      <canvas class="view" aria-hidden="true"></canvas>
      <div class="room-light" aria-hidden="true"></div>
      <canvas class="fog" aria-label="Fogged glass. Drag or touch to wipe the condensation away."></canvas>
      <div class="glass-reflection" aria-hidden="true"></div>
      <div class="frame frame--top" aria-hidden="true"></div>
      <div class="frame frame--left" aria-hidden="true"></div>
      <div class="frame frame--right" aria-hidden="true"></div>
      <div class="frame frame--bottom" aria-hidden="true"></div>

      <header class="topline">
        <a class="wordmark" href="#" aria-label="Foggy Window home">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>stillroom</span>
        </a>
        <span class="edition" aria-live="polite">A little quiet, please</span>
      </header>

      <section class="note" aria-label="Wiping instructions">
        <p class="instruction"><span class="gesture" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M8 11V6.5a1.5 1.5 0 0 1 3 0V11 5a1.5 1.5 0 0 1 3 0v6-4a1.5 1.5 0 0 1 3 0v5.2l.3-1a1.5 1.5 0 0 1 2.9.8l-1.4 5A4 4 0 0 1 16 20h-3.5a4 4 0 0 1-3.2-1.6L6.5 15a1.6 1.6 0 0 1 2.4-2.1L11 15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="instruction-copy">Drag your finger to wipe the fog away.</span></p>
        <button class="camera-toggle" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h8A1.5 1.5 0 0 1 15 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 4 16.5v-9ZM15 10l5-3v10l-5-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Enable hand tracking</span>
        </button>
      </section>

      <div class="bottom-controls">
        <label class="wipe-control" for="wipe-size">
          <span>Wipe size</span>
          <input id="wipe-size" type="range" min="36" max="180" value="92" aria-label="Wipe size">
          <output class="wipe-size-value" for="wipe-size">92 px</output>
        </label>
        <button class="reset" type="button" aria-label="Restore the fog" title="Restore the fog">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7v5h-5M4.9 9a7.5 7.5 0 0 1 12.7-2.1L20 12M4 17v-5h5m10.1 3a7.5 7.5 0 0 1-12.7 2.1L4 12" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Reset</span>
        </button>
      </div>

      <div class="coordinates" aria-hidden="true"><span>07:18</span><span class="coord-divider"></span><span>OUTSIDE, QUIETLY</span></div>
      <div class="bottom-caption" aria-hidden="true"><span>THE WORLD IS STILL WAKING</span><span class="caption-line"></span><span>01 — 01</span></div>
      <div class="grain" aria-hidden="true"></div>
    </main>
  </body>
</html>
